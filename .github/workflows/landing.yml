name: Public landing

"on":
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing.yml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
  push:
    branches: [develop]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Public landing checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check syntax
        working-directory: apps/landing
        run: npm run lint
      - name: Test public build and preview boundary
        working-directory: apps/landing
        run: npm test
      - name: Build preview artifact without a publication domain
        working-directory: apps/landing
        run: npm run build
