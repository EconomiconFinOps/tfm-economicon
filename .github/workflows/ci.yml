name: CI

"on":
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: JUP policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate JUP traceability and rotating roles
        run: node tools/pr-policy.mjs --event "$GITHUB_EVENT_PATH"

  governance:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Validate governance tooling
        run: |
          corepack pnpm jup:check:test
          corepack pnpm pr:check:test
          corepack pnpm jup:check:all
          corepack pnpm openspec:validate

  python-tests:
    name: Python tests (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: azure-cost-api
            path: apps/azure-cost-api
          - name: backend
            path: apps/backend
          - name: processor
            path: apps/processor
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        working-directory: ${{ matrix.service.path }}
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.service.path }}
        run: python -m pytest tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build frontend
        run: corepack pnpm --filter @finops/frontend build
