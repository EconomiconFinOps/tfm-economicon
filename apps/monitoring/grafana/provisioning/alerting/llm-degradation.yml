apiVersion: 1

groups:
  - orgId: 1
    name: llm-degradation
    folder: Economicon
    interval: 1m
    rules:
      - uid: llm-provider-error-ratio
        title: LLM - tasa de errores del proveedor
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          component: llm
          jup: JUP-046
        annotations:
          __dashboardUid__: economicon-llm-degradation
          __panelId__: "4"
          summary: "Errores LLM sostenidos en {{ $labels.job }} / {{ $labels.operation }}"
          description: >-
            Más del 20% de llamadas completas fallan en 5 minutos, con al menos
            5 llamadas y durante 2 minutos. Cada llamada incluye sus reintentos.
            Consulta volumen, categoría de error y logs/trazas correlacionados.
            Normal con poco tráfico no demuestra salud; NoData indica ausencia
            de observaciones y Error un fallo al evaluar la regla.
          runbook_url: https://github.com/EconomiconFinOps/tfm-economicon/blob/develop/docs/runbooks/llm-degradation.md
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                (
                  (
                    sum by (job, instance, operation) (increase(llm_provider_requests_total{outcome="failure"}[5m]))
                    or on (job, instance, operation)
                    (0 * sum by (job, instance, operation) (increase(llm_provider_requests_total[5m])))
                  )
                  / clamp_min(sum by (job, instance, operation) (increase(llm_provider_requests_total[5m])), 1)
                  > bool 0.20
                )
                * on (job, instance, operation)
                (sum by (job, instance, operation) (increase(llm_provider_requests_total[5m])) >= bool 5)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
      - uid: llm-embedding-latency
        title: LLM - latencia de embeddings
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          component: llm
          jup: JUP-046
        annotations:
          __dashboardUid__: economicon-llm-degradation
          __panelId__: "5"
          summary: "Latencia de embeddings sostenida en {{ $labels.job }}"
          description: >-
            El p95 de llamadas completas supera 10 segundos en 5 minutos, con
            al menos 5 llamadas y durante 2 minutos. Incluye reintentos y esperas.
            El p95 es una estimación por buckets; revisar trazas antes de atribuir
            la causa al modelo. NoData no equivale a salud ni a degradación.
          runbook_url: https://github.com/EconomiconFinOps/tfm-economicon/blob/develop/docs/runbooks/llm-degradation.md
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                (
                  histogram_quantile(0.95,
                    sum by (job, instance, operation, le) (rate(llm_provider_request_duration_seconds_bucket{operation="embedding"}[5m]))
                  ) > bool 10
                )
                * on (job, instance, operation)
                (sum by (job, instance, operation) (increase(llm_provider_requests_total{operation="embedding"}[5m])) >= bool 5)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
      - uid: llm-generation-latency
        title: LLM - latencia de generación
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
          component: llm
          jup: JUP-046
        annotations:
          __dashboardUid__: economicon-llm-degradation
          __panelId__: "6"
          summary: "Latencia de generación sostenida en {{ $labels.job }}"
          description: >-
            El p95 de llamadas completas supera 20 segundos en 5 minutos, con
            al menos 5 llamadas y durante 2 minutos. Incluye reintentos y esperas.
            El p95 es una estimación por buckets; revisar trazas antes de atribuir
            la causa al modelo. NoData no equivale a salud ni a degradación.
          runbook_url: https://github.com/EconomiconFinOps/tfm-economicon/blob/develop/docs/runbooks/llm-degradation.md
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: >-
                (
                  histogram_quantile(0.95,
                    sum by (job, instance, operation, le) (rate(llm_provider_request_duration_seconds_bucket{operation="generation"}[5m]))
                  ) > bool 20
                )
                * on (job, instance, operation)
                (sum by (job, instance, operation) (increase(llm_provider_requests_total{operation="generation"}[5m])) >= bool 5)
              instant: true
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
