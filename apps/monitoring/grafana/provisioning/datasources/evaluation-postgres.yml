apiVersion: 1

datasources:
  - name: Evaluacion
    uid: evaluation-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres-pgvector:5432
    user: grafana_evaluation_reader
    editable: false
    jsonData:
      database: embeddings
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 3600
    secureJsonData:
      password: $GRAFANA_EVALUATION_DB_PASSWORD
