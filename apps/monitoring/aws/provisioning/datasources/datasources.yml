apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
  - name: Evaluacion
    uid: evaluation-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $GRAFANA_EVALUATION_DB_HOST
    user: grafana_evaluation_reader
    editable: false
    jsonData:
      database: embeddings
      sslmode: verify-full
      tlsConfigurationMethod: file-path
      sslRootCertFile: /etc/grafana/rds-ca.pem
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 3600
    secureJsonData:
      password: $GRAFANA_EVALUATION_DB_PASSWORD
