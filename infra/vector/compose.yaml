services:
  postgres-pgvector:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    restart: unless-stopped
    environment:
      POSTGRES_DB: embeddings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-55421}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d embeddings"]
      interval: 5s
      timeout: 5s
      retries: 20
  validate:
    profiles: [validation]
    build:
      context: ../../apps/processor
      dockerfile: Dockerfile
    environment:
      VECTOR_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?required}@postgres-pgvector:5432/embeddings
      EMBEDDING_DIMENSION: "8"
    volumes:
      - ../..:/workspace:ro
    entrypoint: [python, /workspace/scripts/validate_vector_database.py]
    depends_on:
      postgres-pgvector:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
volumes:
  pgvector-data:
