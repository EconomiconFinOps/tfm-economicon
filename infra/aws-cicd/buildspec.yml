version: 0.2
env:
  exported-variables:
    - PLAN_SHA256
phases:
  install:
    runtime-versions:
      python: '3.12'
      nodejs: '22'
    commands:
      - python -m pip install --require-hashes -r tools/aws_demo/requirements.lock
      - python tools/aws_demo/install_terraform.py
      - export PATH="$CODEBUILD_SRC_DIR/.work/bin:$PATH"
  build:
    commands:
      - python tools/aws_demo/runner.py
      - >-
        export PLAN_SHA256="$(python -c 'import json,pathlib; p=pathlib.Path(".work/aws-demo/approval.json"); print(json.loads(p.read_text())["sha256"] if p.is_file() else "")')"
# Plan/state/passwords never go to CodePipeline output artifacts or console.
# Restricted cycle artifacts are uploaded explicitly by the runner.
