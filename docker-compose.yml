services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.1.11
    command:
      - start-single-node
      - --insecure
      - --listen-addr=0.0.0.0:26257
      - --http-addr=0.0.0.0:8080
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: embeddings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d embeddings"]
      interval: 10s
      timeout: 5s
      retries: 10

  azure-cost-api:
    build:
      context: .
      dockerfile: apps/azure-cost-api/Dockerfile
    environment:
      AZURE_COST_AUTH_ENABLED: "${AZURE_COST_AUTH_ENABLED:-true}"
      AZURE_COST_VALID_TOKENS: "${AZURE_COST_VALID_TOKENS:-jupiter-local-token}"
      AZURE_COST_FORBIDDEN_TOKENS: "${AZURE_COST_FORBIDDEN_TOKENS:-jupiter-forbidden-token}"
      AZURE_COST_PAGE_SIZE: "${AZURE_COST_PAGE_SIZE:-10}"
      AZURE_COST_SKIPTOKEN_SECRET: "${AZURE_COST_SKIPTOKEN_SECRET:-jupiter-local-skiptoken-secret}"
      AZURE_COST_DEFAULT_SCENARIO: "${AZURE_COST_DEFAULT_SCENARIO:-normal}"
      AZURE_COST_FAKE_TIMEOUT_SECONDS: "${AZURE_COST_FAKE_TIMEOUT_SECONDS:-2}"
      AZURE_COST_RETRY_AFTER_SECONDS: "${AZURE_COST_RETRY_AFTER_SECONDS:-1}"
    ports:
      - "${AZURE_COST_API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./apps/backend
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://root@cockroachdb:26257/defaultdb?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres-pgvector:5432/embeddings}
      PROCESSOR_QUEUE_NAME: ${PROCESSOR_QUEUE_NAME:-processor:jobs}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-8}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-replace-me-auth-secret}
      AUTH_TOKEN_TTL_MINUTES: ${AUTH_TOKEN_TTL_MINUTES:-480}
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-pgvector:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  processor:
    build:
      context: ./apps/processor
    env_file:
      - .env
    environment:
      PROCESSOR_PORT: ${PROCESSOR_PORT:-8001}
      PROCESSOR_CONCURRENCY: ${PROCESSOR_CONCURRENCY:-2}
      PROCESSOR_QUEUE_NAME: ${PROCESSOR_QUEUE_NAME:-processor:jobs}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://root@cockroachdb:26257/defaultdb?sslmode=disable}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      VECTOR_DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres-pgvector:5432/embeddings}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-8}
      EMBEDDING_CHUNK_SIZE: ${EMBEDDING_CHUNK_SIZE:-500}
      EMBEDDING_CHUNK_OVERLAP: ${EMBEDDING_CHUNK_OVERLAP:-50}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
    depends_on:
      cockroachdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-pgvector:
        condition: service_healthy
    ports:
      - "${PROCESSOR_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  cockroach-data:
  pgvector-data:
